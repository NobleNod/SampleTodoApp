 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

ext {
    slf4jVersion = '2.0.1'
}
dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    implementation "org.eclipse.jetty:jetty-server:12.0.8"
    implementation "org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.8"
    implementation "org.eclipse.jetty.ee10:jetty-ee10-annotations:12.0.8"
    implementation "org.eclipse.jetty.ee10.websocket:jetty-ee10-websocket-jetty-server:12.0.8"

    implementation "jakarta.servlet:jakarta.servlet-api:6.0.0"
    implementation "org.glassfish.jersey.containers:jersey-container-servlet:3.1.6"
    implementation group: 'org.glassfish.jersey.inject', name: 'jersey-hk2', version: '3.1.6'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.6'

    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.14.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.14.2'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
